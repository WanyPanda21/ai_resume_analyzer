# This workflow automatically deploys the project when you push changes to the main branch.
name: Deploy AI Resume Analyzer

on:

  push:
    branches:
      - main

    paths:
      - 'backend/**'
      - 'template.yml'
      - 'samconfig.toml'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:


permissions:

  id-token: write

  contents: read


jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.13'


      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2


      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ap-southeast-2


      - name: Build SAM application
        run: sam build --template-file template.yml


      - name: Validate SAM template
        run: sam validate --template-file .aws-sam/build/template.yaml


      - name: Deploy application
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name ai-resume-analyzer \
            --region ap-southeast-2 \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BedrockModelId=apac.anthropic.claude-3-5-sonnet-20241022-v2:0 \
              StageName=prod
