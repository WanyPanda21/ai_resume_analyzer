
# Automatically deploy AI Resume Analyzer when changes are pushed to main.

name: Deploy AI Resume Analyzer

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'template.yml'
      - 'samconfig.toml'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 3. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 4. Install dependencies for secret synchronization
      - name: Install Secret Sync Dependencies
        run: |
          python -m pip install boto3

      # 5. Create or update Claude API key in AWS Secrets Manager
      - name: Sync Claude API Key to Secrets Manager
        env:
          AWS_REGION: ap-southeast-2
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_SECRET_NAME: ai-resume-analyzer/anthropic-api-key
        run: |
          python scripts/sync_claude_secret.py

      # 6. Setup AWS SAM CLI
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      # 7. Build SAM application
      - name: Build SAM application
        run: sam build --template-file template.yml

      # 8. Validate SAM template
      - name: Validate SAM template
        run: sam validate --template-file .aws-sam/build/template.yaml

      # 9. Deploy application
      - name: Deploy application
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name ai-resume-analyzer \
            --region ap-southeast-2 \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              StageName=prod
