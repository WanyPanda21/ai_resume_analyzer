
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: AI Resume Analyzer using FastAPI, AWS Lambda, S3, DynamoDB and Anthropic Claude API

Parameters:

  AnthropicSecretName:
    Type: String
    Default: ai-resume-analyzer/anthropic-api-key
    Description: Secrets Manager name containing the Claude API key

  ClaudeModel:
    Type: String
    Default: claude-sonnet-5
    Description: Anthropic Claude model name

  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name


Resources:

  # --------------------------------
  # S3 BUCKET - STORE RESUME PDF FILES
  # --------------------------------

  ResumeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ai-resume-analyzer-${AWS::AccountId}-${AWS::Region}'

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldResumes
            Status: Enabled
            ExpirationInDays: 90


  # --------------------------------
  # DYNAMODB - CANDIDATES TABLE
  # --------------------------------

  CandidatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CandidatesTable
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: candidate_id
          AttributeType: S

      KeySchema:
        - AttributeName: candidate_id
          KeyType: HASH

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true


  # --------------------------------
  # DYNAMODB - ANALYSES TABLE
  # --------------------------------

  AnalysesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AnalysesTable
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: analysis_id
          AttributeType: S

      KeySchema:
        - AttributeName: analysis_id
          KeyType: HASH

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true


  # --------------------------------
  # API GATEWAY - HTTP API
  # --------------------------------

  ResumeHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName


  # --------------------------------
  # MAIN FASTAPI LAMBDA FUNCTION
  # --------------------------------

  ResumeAnalyzerFunction:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName: !Sub '${AWS::StackName}-resume-analyzer'

      CodeUri: backend/

      Handler: main.handler

      Runtime: python3.13

      Timeout: 60

      MemorySize: 1024

      Architectures:
        - x86_64

      Environment:
        Variables:

          AWS_REGION: !Ref AWS::Region

          CANDIDATES_TABLE: !Ref CandidatesTable

          ANALYSES_TABLE: !Ref AnalysesTable

          RESUME_BUCKET: !Ref ResumeBucket

          ANTHROPIC_SECRET_NAME: !Ref AnthropicSecretName

          CLAUDE_MODEL: !Ref ClaudeModel

          MAX_PDF_BYTES: '5242880'


      # --------------------------------
      # IAM PERMISSIONS
      # --------------------------------

      Policies:

        # S3 upload, download and delete permissions
        - S3CrudPolicy:
            BucketName: !Ref ResumeBucket

        # Candidates DynamoDB permissions
        - DynamoDBCrudPolicy:
            TableName: !Ref CandidatesTable

        # Analyses DynamoDB permissions
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysesTable

        # Retrieve Claude API key from Secrets Manager
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub
                - 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}-*'
                - SecretName: !Ref AnthropicSecretName


      # --------------------------------
      # API GATEWAY EVENTS
      # --------------------------------

      Events:

        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResumeHttpApi
            Path: /
            Method: ANY

        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResumeHttpApi
            Path: /{proxy+}
            Method: ANY


# --------------------------------
# OUTPUTS
# --------------------------------

Outputs:

  ApiBaseUrl:
    Description: Resume Analyzer API Gateway URL
    Value: !Sub 'https://${ResumeHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/'

  ResumeBucketName:
    Description: S3 bucket storing uploaded resumes
    Value: !Ref ResumeBucket

  CandidatesTableName:
    Description: Candidates DynamoDB table
    Value: !Ref CandidatesTable

  AnalysesTableName:
    Description: Analyses DynamoDB table
    Value: !Ref AnalysesTable

  LambdaFunctionName:
    Description: Resume Analyzer Lambda function name
    Value: !Ref ResumeAnalyzerFunction

  ClaudeSecretName:
    Description: Secrets Manager secret name
    Value: !Ref AnthropicSecretName
