
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: AI Resume Analyzer using FastAPI, AWS Lambda, S3, DynamoDB and Anthropic Claude API

Parameters:
  AnthropicSecretName:
    Type: String
    Default: ai-resume-analyzer/anthropic-api-key

  ClaudeModel:
    Type: String
    Default: claude-sonnet-5

  StageName:
    Type: String
    Default: prod

Resources:

  # S3 - Resume storage
  ResumeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ai-resume-analyzer-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldResumes
            Status: Enabled
            ExpirationInDays: 90

  # DynamoDB - Candidates
  CandidatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CandidatesTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: candidate_id
          AttributeType: S
      KeySchema:
        - AttributeName: candidate_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # DynamoDB - Analyses
  AnalysesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AnalysesTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: analysis_id
          AttributeType: S
      KeySchema:
        - AttributeName: analysis_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # API Gateway - HTTP API
  ResumeHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName

      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
        MaxAge: 600

  # Main FastAPI Lambda
  ResumeAnalyzerFunction:
    Type: AWS::Serverless::Function

    Metadata:
      BuildMethod: python3.13
      BuildProperties:
        RequirementsFile: backend/requirements.txt

    Properties:
      FunctionName: !Sub '${AWS::StackName}-resume-analyzer'

      # Include the project root so backend.config and
      # backend.services imports resolve inside Lambda.
      CodeUri: ./

      Handler: backend.main.handler
      Runtime: python3.13
      Timeout: 60
      MemorySize: 1024

      Architectures:
        - x86_64

      Environment:
        Variables:
          CANDIDATES_TABLE: !Ref CandidatesTable
          ANALYSES_TABLE: !Ref AnalysesTable
          RESUME_BUCKET: !Ref ResumeBucket
          ANTHROPIC_SECRET_NAME: !Ref AnthropicSecretName
          CLAUDE_MODEL: !Ref ClaudeModel
          MAX_PDF_BYTES: '5242880'

      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ResumeBucket

        - DynamoDBCrudPolicy:
            TableName: !Ref CandidatesTable

        - DynamoDBCrudPolicy:
            TableName: !Ref AnalysesTable

        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub
                - 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}-*'
                - SecretName: !Ref AnthropicSecretName

      # Explicit API Gateway routes
      Events:

        HealthGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResumeHttpApi
            Path: /health
            Method: GET

        AnalyzeResumePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResumeHttpApi
            Path: /resumes/analyze
            Method: POST

        ListResumesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResumeHttpApi
            Path: /resumes
            Method: GET

        GetResumeGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResumeHttpApi
            Path: /resumes/{candidate_id}
            Method: GET

        DeleteResumeDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResumeHttpApi
            Path: /resumes/{candidate_id}
            Method: DELETE

        GetAnalysisGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResumeHttpApi
            Path: /analyses/{analysis_id}
            Method: GET

Outputs:

  ApiBaseUrl:
    Description: Resume Analyzer API Gateway URL
    Value: !Sub 'https://${ResumeHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'

  ResumeBucketName:
    Value: !Ref ResumeBucket

  CandidatesTableName:
    Value: !Ref CandidatesTable

  AnalysesTableName:
    Value: !Ref AnalysesTable

  LambdaFunctionName:
    Value: !Ref ResumeAnalyzerFunction

  ClaudeSecretName:
    Value: !Ref AnthropicSecretName